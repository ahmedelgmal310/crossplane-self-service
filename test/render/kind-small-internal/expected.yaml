    kind: AppEnvironment
    name: preview
    uid: 17b7980b-2571-5c14-8ca1-1521b9fc385c
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          app.kubernetes.io/managed-by: crossplane
          platform.example.io/environment: preview
          platform.example.io/size: small
          platform.example.io/team: payments
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
        name: payments-preview
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
  watch: true
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: netpol-allow-dns
  labels:
    crossplane.io/composite: preview
  name: preview-netpol-allow-dns
  namespace: team-payments
  ownerReferences:
  - apiVersion: platform.example.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: AppEnvironment
    name: preview
    uid: 17b7980b-2571-5c14-8ca1-1521b9fc385c
spec:
  forProvider:
    manifest:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        labels:
          platform.example.io/environment: preview
          platform.example.io/team: payments
        name: allow-dns
        namespace: payments-preview
      spec:
        egress:
        - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
          to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        podSelector: {}
        policyTypes:
        - Egress
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
  references:
  - dependsOn:
      apiVersion: v1
      kind: Namespace
      name: payments-preview
  watch: true
---
