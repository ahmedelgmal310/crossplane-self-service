---
apiVersion: platform.example.io/v1alpha1
kind: AppEnvironment
metadata:
  labels:
    platform.example.io/team: payments
  name: preview
  namespace: team-payments
spec:
  crossplane:
    resourceRefs:
    - apiVersion: kubernetes.m.crossplane.io/v1alpha1
      kind: Object
      name: preview-deployment
    - apiVersion: kubernetes.m.crossplane.io/v1alpha1
      kind: Object
      name: preview-limitrange
    - apiVersion: kubernetes.m.crossplane.io/v1alpha1
      kind: Object
      name: preview-namespace
    - apiVersion: kubernetes.m.crossplane.io/v1alpha1
      kind: Object
      name: preview-netpol-allow-dns
    - apiVersion: kubernetes.m.crossplane.io/v1alpha1
      kind: Object
      name: preview-netpol-allow-team
    - apiVersion: kubernetes.m.crossplane.io/v1alpha1
      kind: Object
      name: preview-netpol-default-deny
    - apiVersion: kubernetes.m.crossplane.io/v1alpha1
      kind: Object
      name: preview-quota
    - apiVersion: kubernetes.m.crossplane.io/v1alpha1
      kind: Object
      name: preview-service
  database: false
  exposure: internal
  image: env-probe:e2e
  port: 8080
  size: small
status:
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: WatchCircuitClosed
    status: "True"
    type: Responsive
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: ReconcileSuccess
    status: "True"
    type: Synced
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: deployment, limitrange, namespace, and 5 more'
    reason: Creating
    status: "False"
    type: Ready
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: deployment
  labels:
    crossplane.io/composite: preview
  name: preview-deployment
  namespace: team-payments
  ownerReferences:
  - apiVersion: platform.example.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: AppEnvironment
    name: preview
    uid: 17b7980b-2571-5c14-8ca1-1521b9fc385c
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          platform.example.io/environment: preview
          platform.example.io/team: payments
        name: app
        namespace: payments-preview
      spec:
        replicas: 1
        revisionHistoryLimit: 3
        selector:
          matchLabels:
            app.kubernetes.io/name: app
        template:
          metadata:
            labels:
              app.kubernetes.io/name: app
          spec:
            automountServiceAccountToken: false
            containers:
            - env:
              - name: PORT
                value: "8080"
              envFrom:
              - secretRef:
                  name: app-db
                  optional: true
              image: env-probe:e2e
              imagePullPolicy: IfNotPresent
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10
              name: app
              ports:
              - containerPort: 8080
                name: http
              readinessProbe:
                failureThreshold: 2
                httpGet:
                  path: /readyz
                  port: http
                periodSeconds: 2
              resources:
                limits:
                  cpu: 250m
                  memory: 128Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
  readiness:
    celQuery: object.?status.?conditions.orValue([]).exists(c, c.type == 'Available'
      && c.status == 'True') && object.?status.?readyReplicas.orValue(0) == object.?spec.?replicas.orValue(1)
      && object.?status.?updatedReplicas.orValue(0) == object.?spec.?replicas.orValue(1)
    policy: DeriveFromCelQuery
  references:
  - dependsOn:
      apiVersion: v1
      kind: Namespace
      name: payments-preview
  watch: true
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: limitrange
  labels:
    crossplane.io/composite: preview
  name: preview-limitrange
  namespace: team-payments
  ownerReferences:
  - apiVersion: platform.example.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: AppEnvironment
    name: preview
    uid: 17b7980b-2571-5c14-8ca1-1521b9fc385c
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: LimitRange
      metadata:
        labels:
          platform.example.io/environment: preview
          platform.example.io/team: payments
        name: env-defaults
        namespace: payments-preview
      spec:
        limits:
        - default:
            cpu: 500m
            memory: 512Mi
          defaultRequest:
            cpu: 100m
            memory: 128Mi
          type: Container
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
  references:
  - dependsOn:
      apiVersion: v1
      kind: Namespace
      name: payments-preview
  watch: true
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
