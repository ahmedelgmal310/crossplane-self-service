      kind: NetworkPolicy
      metadata:
        labels:
          platform.example.io/environment: preview
          platform.example.io/team: payments
        name: allow-same-team
        namespace: payments-preview
      spec:
        ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                platform.example.io/team: payments
          ports:
          - port: 8080
            protocol: TCP
        podSelector:
          matchLabels:
            app.kubernetes.io/name: app
        policyTypes:
        - Ingress
  providerConfigRef:
    kind: ClusterProviderConfig
    name: in-cluster
  references:
  - dependsOn:
      apiVersion: v1
      kind: Namespace
      name: payments-preview
  watch: true
